name: Generate Automated Videos

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows you to run this manually from the GitHub Actions tab

jobs:
  build-and-render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/actions-setup-python@v5
        with:
          python-version: '3.11' # Stable version for video rendering dependencies

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install moviepy static-ffmpeg pillow

      - name: Run Video Generation Script
        run: python scripts/generate_video.py

      - name: Upload Rendered Videos as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-videos
          path: output/
