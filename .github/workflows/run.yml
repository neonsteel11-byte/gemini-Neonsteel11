name: Comprehensive YouTube Factory

on:
  schedule:
    - cron: '0 12 * * *' # Automatically kicks off daily
  workflow_dispatch: # Allows you to press the manual run button whenever you want

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Initialize Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 🎬 Render Video Assets
        run: |
          mkdir -p output
          if [ -f main.py ]; then python main.py; fi
          if [ -f scripts/render_video.py ]; then python scripts/render_video.py; fi

      - name: 🚀 Execute Factory Modules & Stream to YouTube
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python scripts/generate_video.py
