name: Generate Automated Videos

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *' # Automatically runs every day at 4:00 PM UTC

jobs:
  build-and-render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install moviepy static-ffmpeg pillow google-genai gTTS requests google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Run Video Generation & Upload Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python scripts/generate_video.py

      - name: Upload Rendered Videos as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-videos
          path: output/
