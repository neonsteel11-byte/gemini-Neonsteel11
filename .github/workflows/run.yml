name: Comprehensive YouTube Factory

on:
  schedule:
    # 17:30 UTC launches the primary video assembly line
    - cron: '30 17 * * *'
    # 23:30 UTC triggers the performance checking/CTR rewriting sequence
    - cron: '30 23 * * *'
  workflow_dispatch:

jobs:
  build-and-optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Initialize Environment
        uses: actions/setup-python@v5
        with:
          python-file-v: '3.11'
          cache: 'pip'

      - name: Setup System Enablers
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build Libraries
        run: pip install -r requirements.txt

      - name: Run Self-Healing Assembly Line
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python scripts/generate_video.py

      - name: Run Analytics Optimizer Check
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python scripts/optimize_ctr.py
