name: Shorts Automation
on:
  workflow_dispatch:
  schedule:
    # USA Peak: 2-4 PM EST (highest engagement for educational content)
    - cron: '0 19 * * *'
    # Europe Peak: 6-8 PM CET  
    - cron: '0 18 * * *'
    # Weekend Bonus: 12 PM EST (leisure browsing)
    - cron: '0 17 * * 0,6'

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      
      - name: Pick today's content
        id: pick_company
        run: |
          COMPANY=$(python scripts/pick_company.py)
          echo "company=$COMPANY" >> "$GITHUB_OUTPUT"
      
      - name: Produce and upload Short
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          COMPANY: ${{ steps.pick_company.outputs.company }}
        run: |
          set -e
          echo "Producing Short: $COMPANY"
          python main.py "$COMPANY" --type short --upload --privacy public
