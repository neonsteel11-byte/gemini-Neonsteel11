name: Daily Finance Video Automation
on:
  workflow_dispatch:
  schedule:
    # 23:00 UTC = 7:00 PM Eastern (6:00 PM during EDT) -- start of US evening peak viewing window
    - cron: '0 23 * * *'
jobs:
  build-and-run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4
    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install System FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
    - name: Install Python Requirements
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
    - name: Execute Full Video Productions and Upload to YouTube
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
        YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        GEMINI_IMAGE_MODE: "false"
      run: |
        set -e
        echo "🎬 STEP 1: Producing & Uploading YouTube Short..."
        python main.py "Tesla" --type short --upload --privacy private
        echo "🎬 STEP 2: Producing & Uploading Long-Form Video..."
        python main.py "Tesla" --type long --upload --privacy private
    - name: Commit video manifest
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add video_manifest.json company_state.json
        git diff --staged --quiet || git commit -m "Log uploaded videos and rotation state"
        for i in 1 2 3 4 5; do
          git pull --rebase origin main && git push && break
          echo "Push rejected, retrying ($i/5)..."
          sleep 5
        done
