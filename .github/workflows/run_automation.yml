name: Daily Finance Video Automation

on:
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Python Requirements
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    - name: Execute Full Video Productions (Short & Long)
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        GEMINI_IMAGE_MODE: "false"
      run: |
        echo "🎬 STEP 1: Launching YouTube Short Production..."
        python main.py "Tesla" --type short
        
        echo "🎬 STEP 2: Launching Long-Form Video Production..."
        python main.py "Tesla" --type long
