name: Daily Finance Video Automation

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab
  schedule:
    - cron: '0 12 * * *' # Runs automatically every day (adjust as needed)

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/python-env@v5
      with:
        python-version: '3.11'

    - name: Install System FFmpeg (Cloud Dependency)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Python Requirements
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    - name: Execute Video Automation Engine
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        GEMINI_IMAGE_MODE: "false"
      run: |
        python main.py "Tesla" --type short
