name: Shorts Automation
on:
  workflow_dispatch:
  schedule:
    # USA Peak Time: 2 PM EST = 7 PM UTC (weekdays)
    - cron: '0 19 * * 1-5'
    # Weekend: 12 PM EST = 5 PM UTC
    - cron: '0 17 * * 0,6'
    # Secondary: Europe Peak 6 PM CET = 5 PM UTC
    - cron: '0 17 * * *'

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      
      - name: Pick today's content
        id: pick_company
        run: |
          COMPANY=$(python scripts/pick_company.py)
          echo "company=$COMPANY" >> "$GITHUB_OUTPUT"
          echo "Selected: $COMPANY"
      
      - name: Produce and upload Short
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          GEMINI_IMAGE_MODE: "false"
          # NEW: Pexels + Replicate integration
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          USE_PEXELS: "true"
          USE_REPLICATE: "true"
          COMPANY: ${{ steps.pick_company.outputs.company }}
        run: |
          set -e
          echo "Producing Short: $COMPANY"
          python main.py "$COMPANY" --type short --upload --privacy private
      
      - name: Upload captions as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: captions-${{ github.run_id }}
          path: output/*_caption.txt
          retention-days: 14
      
      - name: Commit rotation state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add video_manifest.json company_state.json angle_state.json 2>/dev/null || git add video_manifest.json
          git diff --staged --quiet || git commit -m "Log Short upload"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            sleep 5
          done
