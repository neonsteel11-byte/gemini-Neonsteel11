name: Daily Finance Video Automation
on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'
jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4
    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install System FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
    - name: Install Python Requirements
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
    - name: Execute Full Video Productions and Upload to YouTube
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        GEMINI_IMAGE_MODE: "false"
        YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
        YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      run: |
        echo "🎬 STEP 1: Producing & Uploading YouTube Short..."
        python main.py "Tesla" --type short --upload --privacy private
        echo "🎬 STEP 2: Producing & Uploading Long-Form Video..."
        python main.py "Tesla" --type long --upload --privacy private
