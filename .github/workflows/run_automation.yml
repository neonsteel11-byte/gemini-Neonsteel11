name: Daily Finance Video Automation
on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'
jobs:
  build-and-run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: sudo apt-get update && sudo apt-get install -y ffmpeg
    - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
    - name: Pick today's company
      id: pick_company
      run: |
        COMPANY=$(python scripts/pick_company.py)
        echo "company=$COMPANY" >> "$GITHUB_OUTPUT"
        echo "Selected company: $COMPANY"
    - name: Execute Full Video Productions and Upload to YouTube
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
        YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        GEMINI_IMAGE_MODE: "false"
        COMPANY: ${{ steps.pick_company.outputs.company }}
      run: |
        set -e
        echo "STEP 1: Short about $COMPANY..."
        python main.py "$COMPANY" --type short --upload --privacy private
        echo "STEP 2: Long about $COMPANY..."
        python main.py "$COMPANY" --type long --upload --privacy private
    - name: Commit video manifest
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add video_manifest.json company_state.json 2>/dev/null || git add video_manifest.json
        git diff --staged --quiet || git commit -m "Log manifest and rotation state"
        for i in 1 2 3 4 5; do
          git pull --rebase origin main && git push && break
          sleep 5
        done
