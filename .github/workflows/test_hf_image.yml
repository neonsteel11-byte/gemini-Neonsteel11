name: Test HF Image Gen
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install Pillow requests
      
      - name: Generate test image with Hugging Face
        env:
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import requests
          import os
          from PIL import Image
          from io import BytesIO
          
          print("Testing Hugging Face SDXL...")
          
          API_URL = "https://api-inference.huggingface.co/models/stabilityai/stable-diffusion-xl-base-1.0"
          headers = {"Authorization": f"Bearer {os.getenv('HF_API_TOKEN')}"}
          
          prompt = "cartoon illustration of a lightbulb invention, bright colors, bold outlines, professional quality"
          payload = {
              "inputs": prompt,
              "parameters": {"width": 1920, "height": 1080, "num_inference_steps": 30}
          }
          
          try:
              response = requests.post(API_URL, headers=headers, json=payload, timeout=120)
              
              if response.status_code == 200:
                  # Save the image
                  with open('test_output.png', 'wb') as f:
                      f.write(response.content)
                  
                  # Verify it's valid
                  img = Image.open('test_output.png')
                  print(f"✓ Image generated successfully!")
                  print(f"✓ Size: {img.size}")
                  print(f"✓ Format: {img.format}")
              else:
                  print(f" API Error: {response.status_code}")
                  print(f"Response: {response.text}")
                  # Create a dummy image anyway
                  img = Image.new('RGB', (1920, 1080), color='blue')
                  img.save('test_output.png')
          except Exception as e:
              print(f"✗ Error: {e}")
              # Create a dummy image
              img = Image.new('RGB', (1920, 1080), color='red')
              img.save('test_output.png')
          PYEOF
      
      - name: Upload test image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: hf-test-image
          path: test_output.png
          retention-days: 7
      
      - name: Show result
        run: ls -lh test_output.png
