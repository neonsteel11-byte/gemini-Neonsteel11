name: Test HF Image Gen
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Test HF image generation
        env:
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'scripts')
          from image_gen import generate_image_huggingface
          success = generate_image_huggingface(
              'a respectful cartoon portrait of Richard James, inventor of the Slinky, 1940s naval engineer, flat cartoon style, bold outlines, bright colors, no text',
              'test_output.png',
              (1024, 1024)
          )
          print(f'Result: {success}')
          "
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hf-test-image
          path: test_output.png
          if-no-files-found: ignore
