name: Auto-Optimize Underperforming Videos
on:
  # DISABLED: duplicate of optimize_underperforming.yml, which runs daily and does the same job.
  # Running both risks optimizing the same video twice, which can look manipulative to YouTube.
  # Re-enable the schedule line below if optimize_underperforming.yml is ever disabled instead.
  # schedule:
  #   - cron: '0 10 * * 0'  # Every Sunday at 10:00 AM UTC
  workflow_dispatch:      # Manual triggering still available

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - run: python -m pip install --upgrade pip google-api-python-client google-auth-httplib2 google-auth-oauthlib requests
      
      - name: Run Auto-Optimizer
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/auto_optimize.py
        
      - name: Commit manifest updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add video_manifest.json
          git diff --staged --quiet || git commit -m "chore: auto-optimized underperforming videos"
          git push origin main
