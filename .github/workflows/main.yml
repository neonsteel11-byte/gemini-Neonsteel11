name: Automation Pipeline
on:
  schedule:
    - cron: '0 12 * * *'  # Automatically triggers every single day at 12:00 PM UTC
  workflow_dispatch:      # Keeps the manual run button in the GitHub UI active

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Automatically Generate Video and Manifest
        run: python scripts/generate_video.py

      - name: Upload to YouTube
        run: python scripts/upload_to_youtube.py
