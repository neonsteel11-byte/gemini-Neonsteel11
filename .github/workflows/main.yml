name: Automation Pipeline
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Debug Exact Secret Formats
        run: |
          echo "=== SECRET INSPECTOR ==="
          echo "Client ID Length: ${#YT_CLIENT_ID}"
          echo "Client ID Ends with .com?: $( [[ "$YT_CLIENT_ID" == *.apps.googleusercontent.com ]] && echo 'YES' || echo 'NO' )"
          echo "Client Secret Length: ${#YT_CLIENT_SECRET}"
          echo "Refresh Token Length: ${#YT_REFRESH_TOKEN}"
          echo "========================"

      - name: Create test video
        run: |
          mkdir -p output
          curl -L --fail -o output/test.mp4 https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4 || true

      - name: Upload to YouTube
        run: python scripts/upload_to_youtube.py
