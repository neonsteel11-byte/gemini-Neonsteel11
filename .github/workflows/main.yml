name: Run Funny Finance Bot

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      TEST_MODE:
        description: 'Set to false for real YouTube uploads'
        required: true
        default: 'true'

permissions:
  contents: write

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout@v4
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install google-generativeai gTTS google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Run Video Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
        run: python main.py

      - name: Upload to YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TEST_MODE: ${{ github.event.inputs.TEST_MODE || 'true' }}
        run: python scripts/upload_to_youtube.py
