name: Simple HF Test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests Pillow huggingface_hub
      - name: Test HF API
        env:
          HF_TOKEN: ${{ secrets.HF_API_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import os
          token = os.getenv('HF_TOKEN', '')
          print(f"Token length: {len(token)}")
          from huggingface_hub import InferenceClient
          print("Sending request via InferenceClient (provider=together)...")
          try:
              client = InferenceClient(provider="together", api_key=token)
              img = client.text_to_image("cartoon lightbulb, bright colors", model="black-forest-labs/FLUX.1-schnell")
              img.save("image.png")
              print("SUCCESS: Image saved!")
          except Exception as e:
              print(f"FAILED: {e}")
              from PIL import Image
              placeholder = Image.new('RGB', (1920,1080), 'blue')
              placeholder.save("image.png")
          PYEOF
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: test-image-result
          path: image.png
