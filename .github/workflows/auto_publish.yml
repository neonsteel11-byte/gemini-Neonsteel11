name: Auto-Publish Reviewed Videos
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
    - name: Run auto-publish check
      env:
        YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
        YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        PUBLISH_DELAY_HOURS: "2"
      run: python scripts/auto_publish.py
    - name: Commit manifest changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add video_manifest.json
        git diff --staged --quiet || git commit -m "Mark videos as auto-published"
        for i in 1 2 3 4 5; do
          git pull --rebase origin main && git push && break
          echo "Push rejected, retrying ($i/5)..."
          sleep 5
        done
