name: Long-Form Automation
on:
  workflow_dispatch:
  schedule:
    # Sunday at 12:00 PM UTC (5:45 PM Nepal Time) - Weekend deep dive
    - cron: '0 12 * * 0'
    # Thursday at 00:00 UTC (5:45 AM Nepal Time) - Midweek upload
    - cron: '0 0 * * 4'

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick
      - run: sudo sed -i '/<policy domain="path" rights="none" pattern="@\*"/d' /etc/ImageMagick-6/policy.xml || true
      
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      
      - name: Pick today's content
        id: pick_company
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          COMPANY=$(python scripts/pick_company.py long)
          echo "company=$COMPANY" >> "$GITHUB_OUTPUT"
          echo "Selected: $COMPANY"
      
      - name: Produce and upload Long-Form Video
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          GEMINI_IMAGE_MODE: "false"
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          USE_PEXELS: "true"
          USE_REPLICATE: "true"
          COMPANY: ${{ steps.pick_company.outputs.company }}
        run: |
          set -o pipefail
          echo "Producing Long-Form Video: $COMPANY"
          RC=0
          python -u main.py "$COMPANY" --type long --upload --privacy unlisted 2>&1 | tee run_full.log || RC=$?
          mkdir -p diagnostics
          grep -v "ElevenLabs" run_full.log | tail -n 400 > diagnostics/last_long.txt || true
          exit $RC
      
      - name: Upload captions as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: longform-captions-${{ github.run_id }}
          path: output/*_caption.txt
          retention-days: 14
      
      - name: Commit rotation state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          FILES="diagnostics/last_long.txt"
          if [ "${{ job.status }}" = "success" ]; then
            FILES="$FILES video_manifest.json topics_used_alltime.json manual_topics.json til_used_ids.json"
          fi
          for f in $FILES; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --staged --quiet || git commit -m "Log Long-Form upload"
          git checkout -- . 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            sleep 5
          done
