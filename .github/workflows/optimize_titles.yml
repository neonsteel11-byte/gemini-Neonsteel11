name: Optimize Underperforming Video Titles
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
    - name: Run optimizer
      env:
        YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
        YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        MIN_VIEWS_THRESHOLD: "10"
        OPTIMIZE_AFTER_HOURS: "24"
      run: python -m scripts.optimize_titles
    - name: Commit updated manifest
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add video_manifest.json
        git diff --staged --quiet || git commit -m "Update video manifest after optimization run"
        for i in 1 2 3 4 5; do
          git pull --rebase origin main && git push && break
          sleep 5
        done
